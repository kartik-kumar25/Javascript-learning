<!DOCTYPE html>
<html>
    <head>
        <title>TODO LIST</title>
        <style>
            body{
                font-family: arial;
            }
            .todo-input-grid{
                display: grid;
                grid-template-columns: 200px 200px 100px;
                gap: 10px;
                align-items: center;
            }
            .todo-input-grid button{
                background-color: rgb(14, 87, 14);
                color: white;
                font-weight: 600;
                border: none;
                cursor: pointer;
                height: 100%;
            }
            .js-list{
                /* grid-column: 1 / -1; */
                display: grid;
                gap: 10px;
            }

            .input-grid{
                display: grid;
                grid-template-columns: 200px 200px 100px;
                gap: 10px;
                align-items: center;
            }
            .input-grid button{
                background-color: rgb(189, 16, 16);
                color: white;
                font-weight: 600;
                cursor: pointer;
                height: 100%;
            }
            .todo-input-grid input, button{
                font-size: 14px;
                padding: 8px;
            }

        </style>
    </head>
    <body>
        <h2 class="todo-title">TODO LIST 2</h2>
        <div class="todo-input-grid">
            <input type="text" placeholder="Todo input" class="js-input todo-input-box" onkeydown="
                enterButton(event);
            ">
            <input class="js-due-date-input" type="date">
            <button class="js-add-button" onclick="
                addButton();
            ">ADD</button>
            <div class="js-list"></div>
        </div>
        <script>
            todoList = [{
                name: 'make dinner',
                dueDate: '21/2/28'},
                {
                name: 'make cake',
                dueDate: '22/2/28'}];
            
            renderTodoList();

            function renderTodoList(){
                let todoListHTML = '';


                for(let i = 0; i < todoList.length; i ++){
                const todoObject = todoList[i]                  //that term index is a posistion in todoList array.
                const { name, dueDate } = todoObject;
                // name = todoObject.name
                // dueDate = todoObject.dueDate

                const html = `
                <div class="input-grid">
                    <div>
                        ${name}
                    </div>
                    <div>
                        ${dueDate}
                    </div>
                    <button onclick="
                        todoList.splice(${i}, 1);
                        renderTodoList();
                    ">DELETE</button>
                </div>
                `;
                todoListHTML += html;
                }
                // console.log(todo);
                console.log(todoListHTML);

                document.querySelector('.js-list')
                    .innerHTML  = todoListHTML;
            }

            function enterButton(event){
                if(event.key === 'Enter'){
                    addButton();
                }
            }

            function addButton(){
                const inputElement = document.querySelector('.js-input');
                const name = inputElement.value;

                const dateInputElement = document.querySelector('.js-due-date-input');
                const dueDate = dateInputElement.value;

                todoList.push({
                    // name: name,
                    // dueDate: dueDate
                    name , dueDate
                });

                // console.log(todoList);

                inputElement.value = '';

                renderTodoList();
            }
        </script>
    </body>
</html>
