<!DOCTYPE html>
<html>
    <head>
        <title> CSS Rock Paper Scissors</title>
        <style>
            body{
                background-color: rgb(25, 25, 25);
                color: white;
                font-family: Arial;
            }
            button{
                font-size: 60px;
                border-radius: 50%;
                padding: 20px 30px;
                margin-left: 10px;
                cursor: pointer;
                border: 2px dashed white;
                background-color: transparent;
            }
            .result-container{
                font-size: 20px;
                font-weight: bold;
            }
            .reset-button, .auto-play-button{
                color: white ;
                font-size: 20px;
                border-radius: 0;
                padding: 10px 20px;
                border: 3px solid white;
            }
        </style>
    </head>
    <body>
        <h1>Rock Paper Scissors</h1>
        <button class="js-rock-button" onclick="
            playGame('✊');
        ">✊</button>


        <button onclick="
            playGame('🖐');
        ">🖐</button>


        <button onclick="
            playGame('✌️');
        ">✌️</button>


        <p class="js-result result-container"></p>
        <p class="js-moves"></p>
        <p class="js-score"></p>

        <button class="reset-button" onclick="
            score.Wins = 0;
            score.Loss = 0;
            score.Ties = 0;
            localStorage.removeItem('score');
            updateScoreElement();
        ">Reset Score</button>

        <button class="auto-play-button" onclick="
            autoPlay()
        ">Auto Play</button>


        <script>
            let score = JSON.parse(localStorage.getItem('score'))
                ||
            {
                Wins: 0,
                Loss: 0,
                Ties: 0
            }

            // updateScoreElement();

            function updateScoreElement(){
                document.querySelector('.js-score')
                    .innerHTML = `WINS: ${score.Wins} :: LOSS: ${score.Loss} :: TIEE: ${score.Ties}`
            }

            JSON.parse(localStorage.getItem('score'))

            let isAutoPLaying = false;
            let intervalId;

            function autoPlay(){
                if(!isAutoPLaying){
                    intervalId = setInterval( function(){
                        const playerMove = pickComputerMove();
                        playGame(playerMove)
                    }, 1000)
                    isAutoPLaying = true;
                } else {
                    clearInterval(intervalId);
                    isAutoPLaying = false
                }
            }



            function playGame(playerMove){
                const computerMove = pickComputerMove();
                let result = '';

                if(playerMove === '✊'){
                    if(computerMove === '✌️'){
                        result = 'You Win.';
                    } else if(computerMove === '🖐'){
                        result = 'You Loose.';
                    } else if(computerMove === '✊'){
                        result = 'Tiee.';
                    }
                } else if(playerMove === '🖐'){
                    if(computerMove === '✌️'){
                        result = 'You Loose.';
                    } else if(computerMove === '🖐'){
                        result = 'Tiee.';
                    } else if(computerMove === '✊'){
                        result = 'You Win.';
                    }
                }else if(playerMove === '✌️'){
                    if(computerMove === '✌️'){
                        result = 'Tiee.';
                    } else if(computerMove === '🖐'){
                        result = 'You Win.';
                    } else if(computerMove === '✊'){
                        result = 'You Loose.';
                    }
                }  
                
                if(result === 'You Win.'){
                    score.Wins += 1;
                } else if(result === 'You Loose.'){
                    score.Loss += 1;
                } else if(result === 'Tiee.'){
                    score.Ties += 1;
                }

                localStorage.setItem('score' , JSON.stringify(score));

                updateScoreElement();

                document.querySelector('.js-result')
                    .innerHTML = `RESULT : ${result}`;
                
                document.querySelector('.js-moves')
                    .innerHTML = `YOUR MOVE: ${playerMove} ::: COMPUTER MOVE: ${computerMove}`
            }
            
            function pickComputerMove(){
                const randomNumber = Math.random();
                let computerMove = '';

                if(randomNumber > 0 && randomNumber < 1/3){
                    computerMove = '✊';
                } else if(randomNumber > 1/3 && randomNumber < 2/3){
                    computerMove = '🖐'
                } else if(randomNumber > 2/3 && randomNumber < 3){
                    computerMove = '✌️'
                }
                return computerMove;
            }
        </script>
    </body>
</html>
